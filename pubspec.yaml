name: ipsc_power_factor
description: Aplicativo profissional para cálculo do fator de potência IPSC com histórico, gráficos e exportação em PDF.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.3.3
  path: ^1.9.0
  intl: ^0.19.0
  flutter_riverpod: ^2.5.1
  path_provider: ^2.1.4
  share_plus: ^10.0.2
  fl_chart: ^0.65.0
  pdf: ^3.10.7
  printing: ^5.11.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
